<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { display:flex; align-items:center; justify-content:space-between; padding:0 100px; }
.phone { width:340px; background:#fff; border-radius:46px; padding:24px 20px;
  box-shadow:0 40px 90px rgba(20,10,60,.20), inset 0 0 0 9px #11121a; display:grid; gap:13px; }
.notch { width:104px; height:9px; background:#11121a; border-radius:99px; margin:4px auto 0; }
.ph { text-align:center; font-size:26px; }
.pcard { background:#f8f8fd; border-radius:18px; padding:14px 16px; }
.ptop { display:flex; justify-content:space-between; font-size:20px; margin-bottom:7px; }
.pcap { font-size:31px; letter-spacing:3px; }
.prx { font-size:13px; color:#8a8a9a; margin-top:7px; }
.unlock { text-align:center; background:linear-gradient(135deg,#fff7d6,#ffeff9);
  border-radius:999px; padding:11px; font-weight:800; font-size:19px; }
</style></head>
<body>
  <div class="orb1"></div><div class="orb2"></div>
  <div class="brand">🪩🌍 EmojiWorld</div>
  <div class="z" style="max-width:640px">
    <h1>No Words.<br><span class="grad">Just Emoji.</span></h1>
    <div class="sub">The social network where the whole planet<br>speaks one language.</div>
    <div class="kicker" style="margin-top:30px; margin-bottom:0">🎈 Start in 3 seconds — no signup</div>
  </div>
  <div class="phone z">
    <div class="notch"></div>
    <div class="ph">🪩🌍</div>
    <div class="pcard"><div class="ptop"><span>🧑‍🦱 🇧🇷</span><span>🤩</span></div><div class="pcap">⚽🔥🎉🙌</div><div class="prx">❤️ 6 · 🔥 4 · 😂 2</div></div>
    <div class="pcard"><div class="ptop"><span>👧 🇯🇵</span><span>😌</span></div><div class="pcap">📚😮‍💨☕✨</div><div class="prx">❤️ 4 · 🥺 2</div></div>
    <div class="unlock">❤️ ×5 ➡️ 📸 1</div>
  </div>
</body></html>

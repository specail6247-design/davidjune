<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { padding:150px 100px 0; text-align:center; }
h1 { font-size:64px; }
.steps { display:flex; gap:26px; justify-content:center; margin-top:64px; align-items:stretch; }
.step { width:300px; padding:38px 26px; text-align:center; }
.step .big { font-size:74px; line-height:1.1; }
.step .t { font-size:23px; font-weight:800; margin-top:18px; }
.step .d { font-size:16px; color:#6b6b7a; margin-top:10px; line-height:1.5; }
.arrow { font-size:44px; align-self:center; }
</style></head>
<body>
  <div class="orb1"></div><div class="orb2"></div>
  <div class="brand">🪩🌍 EmojiWorld</div>
  <div class="z">
    <div class="kicker">THE ANTI-INSTAGRAM RULE</div>
    <h1>Photos are <span class="grad">earned</span>, not spammed</h1>
    <div class="steps">
      <div class="card step">
        <div class="big">😊✏️</div>
        <div class="t">1. Post in emoji</div>
        <div class="d">Tap emojis like piano keys.<br>😴💭☕ = your morning.</div>
      </div>
      <div class="arrow">➡️</div>
      <div class="card step">
        <div class="big">❤️×5</div>
        <div class="t">2. Collect reactions</div>
        <div class="d">Every 5 reactions fills<br>your photo meter.</div>
      </div>
      <div class="arrow">➡️</div>
      <div class="card step">
        <div class="big">🎟️📸</div>
        <div class="t">3. Unlock a photo</div>
        <div class="d">One ticket = one photo.<br>The feed earned it.</div>
      </div>
    </div>
  </div>
</body></html>

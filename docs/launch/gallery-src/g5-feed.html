<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { display:flex; align-items:center; justify-content:space-between; padding:0 100px; }
.feed { display:flex; gap:22px; }
.fcard { width:290px; padding:18px; display:grid; gap:12px; align-self:start; }
.fhead { display:flex; align-items:center; gap:10px; }
.avatar { width:44px; height:44px; border-radius:99px; font-size:24px; display:grid; place-items:center;
  background:linear-gradient(135deg,#fff1f7,#eef0ff); }
.meta { flex:1; }
.mn { font-weight:700; font-size:16px; }
.mt { font-size:12px; color:#999; }
.mood { font-size:24px; }
.fcap { font-size:34px; letter-spacing:2px; }
.frx { display:flex; gap:6px; }
.chip { background:#f0f0f5; border-radius:99px; padding:6px 11px; font-size:14px; font-weight:700; }
.chip.on { background:linear-gradient(135deg,#ffe3f6,#e6e2ff); }
.sun { width:100%; height:120px; border-radius:14px;
  background:linear-gradient(to bottom, #6b4a8f 0%, #e8797c 45%, #ffc46b 65%, #b05f74 78%, #4a3f6e 100%); position:relative; overflow:hidden; }
.sun::after { content:''; position:absolute; left:50%; top:52%; width:44px; height:44px; margin-left:-22px;
  border-radius:50%; background:radial-gradient(circle,#fff7d6,#ffd76b 60%, transparent 75%);
  box-shadow:0 0 40px 18px rgba(255,190,100,.6); }
.pb { position:absolute; top:8px; right:8px; background:rgba(255,255,255,.85); border-radius:99px;
  padding:3px 8px; font-size:13px; z-index:3; }
.sunwrap { position:relative; }
</style></head>
<body>
  <div class="orb1"></div><div class="orb2"></div>
  <div class="brand">🪩🌍 EmojiWorld</div>
  <div class="z" style="max-width:520px">
    <div class="kicker">ONE FEED, EVERY LANGUAGE</div>
    <h1>The whole planet <span class="grad">gets it</span></h1>
    <div class="sub">Brazil, Japan, Korea — same feed,<br>zero translation needed. 🌍</div>
  </div>
  <div class="feed z">
    <div class="card fcard" style="margin-top:40px">
      <div class="fhead"><div class="avatar">🧑‍🦱</div><div class="meta"><div class="mn">🇧🇷</div><div class="mt">🕐 1h</div></div><div class="mood">🤩</div></div>
      <div class="fcap">⚽🔥🎉🙌</div>
      <div class="frx"><div class="chip on">❤️ 6</div><div class="chip">😂 2</div><div class="chip">🔥 4</div></div>
    </div>
    <div class="card fcard">
      <div class="fhead"><div class="avatar">🧑</div><div class="meta"><div class="mn">🇩🇪</div><div class="mt">🕐 10h</div></div><div class="mood">😆</div></div>
      <div class="sunwrap"><div class="sun"></div><div class="pb">📸</div></div>
      <div class="fcap" style="font-size:28px">✈️🧳🌍📸</div>
      <div class="frx"><div class="chip on">❤️ 8</div><div class="chip">😮 6</div><div class="chip">🔥 3</div></div>
    </div>
  </div>
</body></html>

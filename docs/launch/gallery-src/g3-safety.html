<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { display:flex; align-items:center; justify-content:space-between; padding:0 100px; }
.drawer { width:400px; padding:26px; display:grid; gap:14px; }
.dh { text-align:center; font-size:26px; }
.bubble { background:#f8f9fa; border-radius:18px; padding:12px 18px; font-size:24px;
  display:flex; gap:12px; align-items:center; width:fit-content; }
.bubble .u { font-size:19px; }
.kbd { border-top:1px solid #eee; padding-top:16px; }
.kbd .lbl { font-size:13px; font-weight:700; color:#8a8a9a; margin-bottom:10px; }
.keys { display:flex; flex-wrap:wrap; gap:9px; }
.key { width:52px; height:52px; background:#f0f0f5; border-radius:13px; font-size:27px;
  display:grid; place-items:center; }
.nokey { background:#ffe9ee; color:#c04561; font-size:15px; font-weight:800; width:112px; }
</style></head>
<body>
  <div class="orb1"></div><div class="orb2"></div>
  <div class="brand">🪩🌍 EmojiWorld</div>
  <div class="z" style="max-width:620px">
    <div class="kicker">SAFE FOR AGES 7–97</div>
    <h1>Hate comments?<br><span class="grad">Impossible.</span></h1>
    <div class="sub">Comments are emoji-only, by design.<br>There is no keyboard to type an insult with. 🛡️</div>
  </div>
  <div class="card drawer z">
    <div class="dh">💬✨</div>
    <div class="bubble"><span class="u">👤</span>🔥🔥🔥</div>
    <div class="bubble"><span class="u">👤</span>😍✨</div>
    <div class="bubble"><span class="u">👤</span>🫶🌅</div>
    <div class="kbd">
      <div class="lbl">👇 Reply with emoji</div>
      <div class="keys">
        <div class="key">😀</div><div class="key">🥰</div><div class="key">😂</div>
        <div class="key">🥺</div><div class="key">🔥</div><div class="key">👏</div>
        <div class="key nokey">ABC 🚫</div>
      </div>
    </div>
  </div>
</body></html>
